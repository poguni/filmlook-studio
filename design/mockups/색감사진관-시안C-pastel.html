<div class="top"><h1>색감 사진관 · 시안 C · 파스텔 사진관</h1><p class="sub">말랑한 스티커 네컷 — 기울어진 스티커 사진, 하트 도장, 곰돌이 비교 손잡이, 사탕 모양 흑백 필터. 기믹: 반짝이 스티커<br>프리셋 선택, 비교 슬라이더(사진 위를 끌기), 강도·입자·흑백 필터, 기믹 버튼이 실제로 작동합니다. 색 변화는 CSS 필터로 흉내 낸 시안용 효과입니다.</p></div>

class DCLogic { constructor() { this.state = {}; this.props = {}; } setState(p) { Object.assign(this.state, p); render(); } }

class Component extends DCLogic {
  lib() {
    var DEF = { preset: &#x27;V02&#x27;, strength: 80, cmp: 50, grain: 20, mono: &#x27;N&#x27;, gim: false };
    var PRESETS = [
      { code: &#x27;ORIG&#x27;, no: &#x27;00&#x27;, name: &#x27;원본&#x27;, sub: &#x27;보정 전 사진&#x27;, f: [1, 1, 1, 0, 0, 0] },
      { code: &#x27;P01&#x27;, no: &#x27;01&#x27;, name: &#x27;데일리&#x27;, sub: &#x27;Provia에서 영감&#x27;, f: [1.06, 1.12, 1, 0, 0, 0] },
      { code: &#x27;V02&#x27;, no: &#x27;02&#x27;, name: &#x27;비비드 슬라이드&#x27;, sub: &#x27;Velvia에서 영감&#x27;, f: [1.28, 1.65, 0.98, -4, 0, 0] },
      { code: &#x27;A03&#x27;, no: &#x27;03&#x27;, name: &#x27;소프트 포트레이트&#x27;, sub: &#x27;Astia에서 영감&#x27;, f: [0.9, 1.15, 1.04, 4, 0.04, 0] },
      { code: &#x27;C04&#x27;, no: &#x27;04&#x27;, name: &#x27;다큐 크롬&#x27;, sub: &#x27;Classic Chrome에서 영감&#x27;, f: [1.12, 0.62, 0.98, -10, 0.14, 0] },
      { code: &#x27;N05&#x27;, no: &#x27;05&#x27;, name: &#x27;네거 스냅&#x27;, sub: &#x27;Classic Neg.에서 영감&#x27;, f: [1.22, 0.82, 1, 14, 0.12, 0] },
      { code: &#x27;E06&#x27;, no: &#x27;06&#x27;, name: &#x27;시네마 소프트&#x27;, sub: &#x27;Eterna에서 영감&#x27;, f: [0.78, 0.5, 1.06, -8, 0.05, 0] },
      { code: &#x27;M07&#x27;, no: &#x27;07&#x27;, name: &#x27;모노 그레인&#x27;, sub: &#x27;Acros에서 영감&#x27;, f: [1.25, 1, 1.02, 0, 0, 1] }
    ];
    var MONO = { N: { name: &#x27;없음&#x27;, c: 1, b: 1 }, Y: { name: &#x27;노랑&#x27;, c: 1.08, b: 1 }, R: { name: &#x27;빨강&#x27;, c: 1.2, b: 0.94 }, G: { name: &#x27;초록&#x27;, c: 0.95, b: 1.05 } };
    function lerp(v, t) { return 1 + (v - 1) * t; }
    function fxOf(p, t, m) {
      var f = p.f, mm = p.code === &#x27;M07&#x27; ? MONO[m] : MONO.N;
      return &#x27;contrast(&#x27; + (lerp(f[0], t) * lerp(mm.c, t)).toFixed(3) + &#x27;) saturate(&#x27; + lerp(f[1], t).toFixed(3) + &#x27;) brightness(&#x27; + (lerp(f[2], t) * lerp(mm.b, t)).toFixed(3) + &#x27;) hue-rotate(&#x27; + (f[3] * t).toFixed(1) + &#x27;deg) sepia(&#x27; + (f[4] * t).toFixed(3) + &#x27;) grayscale(&#x27; + (f[5] * t).toFixed(3) + &#x27;)&#x27;;
    }
    function computeVals(s) {
      var p = PRESETS[0], sel = {}, monoSel = {}, i, k;
      for (i = 0; i &lt; PRESETS.length; i++) { if (PRESETS[i].code === s.preset) { p = PRESETS[i]; } }
      for (i = 0; i &lt; PRESETS.length; i++) { sel[PRESETS[i].code] = PRESETS[i].code === p.code ? &#x27;is-on&#x27; : &#x27;&#x27;; }
      for (k in MONO) { monoSel[k] = k === s.mono ? &#x27;is-on&#x27; : &#x27;&#x27;; }
      var t = s.strength / 100;
      return {
        fx: fxOf(p, t, s.mono), cmp: s.cmp, strength: s.strength, grain: s.grain,
        grainOp: (s.grain / 100 * 0.6).toFixed(2),
        presetCode: p.code, presetNo: p.no, presetName: p.name, presetSub: p.sub,
        monoName: MONO[s.mono].name, monoCls: p.code === &#x27;M07&#x27; ? &#x27;&#x27; : &#x27;is-off&#x27;,
        sel: sel, monoSel: monoSel,
        gimCls: s.gim ? &#x27;gim-on&#x27; : &#x27;&#x27;, gimText: s.gim ? &#x27;켜짐&#x27; : &#x27;꺼짐&#x27;
      };
    }
    function applyAction(s, path, val) {
      var a = path.split(&#x27;.&#x27;);
      if (a[0] === &#x27;pick&#x27;) { return { preset: a[1] }; }
      if (a[0] === &#x27;pickMono&#x27;) { return { mono: a[1] }; }
      if (path === &#x27;onStrength&#x27;) { return { strength: +val }; }
      if (path === &#x27;onCmp&#x27;) { return { cmp: +val }; }
      if (path === &#x27;onGrain&#x27;) { return { grain: +val }; }

      return {};

    return { DEF: DEF, PRESETS: PRESETS, MONO: MONO, computeVals: computeVals, applyAction: applyAction };
  }
  renderVals() {
    var self = this, L = this.lib();
    var cur = function () { return Object.assign({}, L.DEF, self.state || {}); };
    var v = L.computeVals(cur());
    var mk = function (path) {
      return function (e) {
        var val = e &amp;&amp; e.target ? e.target.value : null;
        self.setState(L.applyAction(cur(), path, val));
      };
    };
