<!doctype html>
<html lang="ko" data-theme="camera">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="사진 한 장에 필름 색감을 입혀 보는 웹 편집기" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 홈 화면 설치와 오프라인 사용 (PRD O-03) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b1b1b" />
    <title>색감 사진관 · FilmLook Studio</title>
    <script>
      // 마지막으로 고른 테마를 첫 화면부터 적용해 깜빡임을 막음 (PRD O-05)
      try {
        var t = localStorage.getItem('filmlook.theme');
        if (t === 'darkroom' || t === 'pastel') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
